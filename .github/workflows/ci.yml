name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: belok
          POSTGRES_PASSWORD: belok
          POSTGRES_DB: belok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belok"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://belok:belok@localhost:5432/belok_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx vite build
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: services/web/test-results/
          retention-days: 7

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          severity: CRITICAL,HIGH
          exit-code: "1"

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, smoke, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.image }}
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/belok-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          no-cache-filters: runtime
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db,public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/belok-${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: docker push ghcr.io/${{ github.repository_owner }}/belok-${{ matrix.image }}:${{ github.sha }}

  stage:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: staging
      url: https://stage.belok.hamdcreative.com
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deploy
      - name: Point stage at the new images
        run: |
          printf 'image:\n  tag: "%s"\n' "$GITHUB_SHA" > stage.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7} to stage"
          for _ in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

  prod:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://belok.hamdcreative.com
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deploy
      - name: Point prod at the new images
        run: |
          printf 'image:\n  tag: "%s"\n' "$GITHUB_SHA" > prod.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7} to prod"
          for _ in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
