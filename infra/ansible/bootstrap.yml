- name: Create the admin user (run once as root)
  hosts: all
  remote_user: root
  gather_facts: false
  tasks:
    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true
        shell: /bin/bash

    - name: Create admin .ssh directory
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    - name: Authorize admin SSH key
      ansible.builtin.copy:
        dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
        content: "{{ lookup('file', admin_ssh_public_key_path | expanduser) }}\n"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"

    - name: Allow passwordless sudo for admin
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s
