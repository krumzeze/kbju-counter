apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: belok-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: belok
      owner: belok
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
