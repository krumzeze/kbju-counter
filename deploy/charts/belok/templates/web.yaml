apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "belok.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "belok.selector" "web" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "belok.selector" "web" | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "belok.podSecurity" . | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.image.web }}:{{ include "belok.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            {{- include "belok.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "belok.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "belok.selector" "web" | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  labels:
    {{- include "belok.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "belok.selector" "web" | nindent 6 }}
