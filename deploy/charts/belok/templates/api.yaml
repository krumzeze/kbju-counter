apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "belok.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "belok.selector" "api" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "belok.selector" "api" | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Photo analysis can take up to a minute; let in-flight requests finish.
      terminationGracePeriodSeconds: 90
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "belok.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "belok.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "belok.api"]
          {{- include "belok.backendEnv" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            {{- include "belok.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "belok.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "belok.selector" "api" | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if gt (int .Values.api.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    {{- include "belok.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "belok.selector" "api" | nindent 6 }}
{{- end }}
